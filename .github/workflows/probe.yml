name: 9 진단 (쿠팡 페이지 확인)
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "확인할 주소 (공백으로 구분)"
        required: true
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python tools/probe.py ${{ inputs.urls }}
      - run: |
          git config user.name "coupang-bot"; git config user.email "coupang-bot@users.noreply.github.com"
          git add data/debug; git commit -m "debug probe" || true
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
